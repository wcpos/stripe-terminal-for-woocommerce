name: Update POT file

on:
  push:
    branches:
      - main
    paths:
      - "**.php"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update-pot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP with tools
        uses: shivammathur/setup-php@44454db4f0199b8b9685a5d763dc37cbf79108e1 # v2
        with:
          php-version: "8.2"
          # The wp-cli phar bundles i18n-command; no `wp package install` needed
          # (the old pinned install 404'd and then died on composer auth).
          tools: wp-cli:2.12.0

      - name: Update POT file
        run: wp i18n make-pot . languages/stripe-terminal-for-woocommerce.pot --domain=stripe-terminal-for-woocommerce --slug=stripe-terminal-for-woocommerce --package-name="Stripe Terminal for WooCommerce" --headers="{\"Report-Msgid-Bugs-To\":\"https://github.com/wcpos/stripe-terminal-for-woocommerce/issues\"}" --exclude=includes/abstracts,includes/utils,assets/js/blocks

      - name: Check for changes
        id: git-diff
        run: |
          # Compare the full catalogs without the volatile creation date
          git show HEAD:languages/stripe-terminal-for-woocommerce.pot > old.pot
          sed '/^"POT-Creation-Date:/d' languages/stripe-terminal-for-woocommerce.pot > new-normalized.pot
          sed '/^"POT-Creation-Date:/d' old.pot > old-normalized.pot

          if diff old-normalized.pot new-normalized.pot; then
            echo "No changes detected."
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
          fi

          # Clean up temporary files
          rm old.pot new-normalized.pot old-normalized.pot

      # Main only accepts changes through pull requests (repository ruleset),
      # so the regenerated catalog is proposed as a PR instead of pushed.
      # The enterprise policy forbids GITHUB_TOKEN from creating pull requests
      # (the step fails with "GitHub Actions is not permitted to create or
      # approve pull requests"), so this uses the POT_PR_TOKEN repository
      # secret: a fine-grained personal access token scoped to this repo with
      # Contents and Pull requests set to Read and write. Without the secret
      # it falls back to GITHUB_TOKEN and fails as before. Note the generated
      # PR shows no test checks either way: its diff is languages/*.pot only,
      # and test.yml ignores languages/** on pull requests. Review the diff
      # and merge.
      - name: Open pull request with updated POT file
        if: steps.git-diff.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.POT_PR_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(i18n): update languages/stripe-terminal-for-woocommerce.pot"
          branch: i18n/update-pot
          delete-branch: true
          add-paths: languages/*.pot
          title: "chore(i18n): update POT file"
          body: |
            Auto-generated by the Update POT workflow: the translation template
            changed after a merge to main. The diff is limited to
            `languages/stripe-terminal-for-woocommerce.pot`.

            No test checks run on this PR: the Tests workflow ignores
            `languages/**` on pull requests. Review the diff and merge.

            Note for releases: the ZIP is built from the release commit, so a
            release branch must still carry the current POT itself rather than
            wait for this PR.
