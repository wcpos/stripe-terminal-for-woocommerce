name: Release

# A stable release is cut by a push to `main` whose plugin header carries a new X.Y.Z.
# A beta is cut by dispatching this workflow on `next` with an X.Y.Z-betaN header: it is
# published as a GitHub prerelease, which `releases/latest` never returns, so the
# extension catalog and every merchant's updater never see it. Beta testers install
# the zip by hand. The two guards below keep the lanes apart: a push never cuts a beta
# and a dispatch never cuts a stable.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check if version has changed
        id: check_version
        run: |
          set -euo pipefail

          VERSION=$(grep -oP "Version:\s*\K\S+" stripe-terminal-for-woocommerce.php)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta[0-9]+)?$ ]]; then
            echo "::error::Version header '$VERSION' is neither X.Y.Z nor X.Y.Z-betaN"
            exit 1
          fi
          if [[ "$VERSION" == *-beta* ]]; then
            if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] || [ "$GITHUB_REF" != "refs/heads/next" ]; then
              echo "::error::$VERSION is a beta; a beta is cut only by dispatching this workflow on next, never by a push to main or from another ref"
              exit 1
            fi
            PRERELEASE=true
          else
            if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]; then
              echo "::error::$VERSION is a stable version; a stable release is cut only by a push to main"
              exit 1
            fi
            PRERELEASE=false
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_ENV"
          git fetch --prune --unshallow
          if git tag | grep -qx "v$VERSION"; then
            echo "Version has not changed. Skipping release..."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version has changed. Creating new release..."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install composer dependencies
        if: steps.check_version.outputs.release == 'true'
        run: composer install --no-dev

      - name: Install and Build payment-frontend
        if: steps.check_version.outputs.release == 'true'
        working-directory: packages/payment-frontend
        run: |
          npm install
          npm run build

      - name: Extract release notes from CHANGELOG.md
        if: steps.check_version.outputs.release == 'true'
        run: |
          extract_section() {
            awk -v ver="$1" '
              /^## / { if (found) exit; if (index($0, "## " ver " ") == 1 || $0 == "## " ver) found=1; next }
              found { print }
            ' CHANGELOG.md
          }
          extract_section "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          # A beta is the unreleased work; its notes are the Unreleased section as it stands.
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ] && [ "$PRERELEASE" = "true" ]; then
            extract_section "Unreleased" > "$RUNNER_TEMP/release-notes.md"
          fi
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "No CHANGELOG.md entry found for $VERSION; using placeholder notes."
            echo "Release v$VERSION" > "$RUNNER_TEMP/release-notes.md"
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create Release
        if: steps.check_version.outputs.release == 'true'
        run: |
          set -euo pipefail
          PRERELEASE_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_ARGS=(--prerelease)
          fi
          # Without --target a missing tag is created from the default branch, not the commit built here.
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "Release v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${PRERELEASE_ARGS[@]}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload ZIP
        if: steps.check_version.outputs.release == 'true'
        run: |
          rm -rf packages # Remove the packages folder
          # WordPress 7.1.4+ unpacks packages into a randomly suffixed folder and installs a flat zip
          # there, so the zip must hold the installed folder (catalog slug) as its only top-level entry.
          mkdir -p "$RUNNER_TEMP/stage/stripe-terminal-for-woocommerce"
          rsync -a --exclude='.git*' ./ "$RUNNER_TEMP/stage/stripe-terminal-for-woocommerce/"
          (cd "$RUNNER_TEMP/stage" && zip -r "$GITHUB_WORKSPACE/stripe-terminal-for-woocommerce.zip" "stripe-terminal-for-woocommerce" -x "*.git*")
          TOP_LEVEL=$(unzip -Z1 stripe-terminal-for-woocommerce.zip | cut -d/ -f1 | sort -u)
          if [ "$TOP_LEVEL" != "stripe-terminal-for-woocommerce" ]; then
            echo "::error::stripe-terminal-for-woocommerce.zip must contain only stripe-terminal-for-woocommerce/ at the top level, found: $TOP_LEVEL"
            exit 1
          fi
          gh release upload v${{ env.VERSION }} stripe-terminal-for-woocommerce.zip --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
