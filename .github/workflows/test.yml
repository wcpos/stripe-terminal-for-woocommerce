name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'languages/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
  pull_request:
    branches: [main, next]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'languages/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer lint -- --report=summary

  scoped-release:
    name: Scoped release build
    runs-on: ubuntu-latest
    needs: php-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring
          tools: composer

      - name: Copy the untouched checkout for the release build
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          rsync -a --exclude=.git ./ "$RUNNER_TEMP/release/"

      - name: Scope a dev tree
        run: |
          composer install --no-interaction --prefer-dist
          bash scripts/scope-release.sh --keep-dev
          php php-scoper/scope-source.php rewrite tests

      # The prepend goes through an ini file because PHPUnit's separate-process
      # children do not inherit `-d` options, but they do inherit PHP_INI_SCAN_DIR.
      - name: Run the unit suite against the prefixed SDK
        run: |
          mkdir -p "$RUNNER_TEMP/ini"
          printf 'auto_prepend_file=%s/vendor_prefixed/autoload.php\n' "$PWD" > "$RUNNER_TEMP/ini/zz-prepend.ini"
          PHP_INI_SCAN_DIR=":$RUNNER_TEMP/ini" php vendor/bin/phpunit --configuration phpunit.xml.dist

      - name: Build the release tree
        working-directory: ${{ runner.temp }}/release
        run: |
          composer install --no-dev --no-interaction --prefer-dist
          bash scripts/scope-release.sh

      - name: Smoke test, bare and with a foreign SDK loaded first
        run: |
          php "$RUNNER_TEMP/release/php-scoper/smoke-test.php" "$RUNNER_TEMP/release"
          mkdir -p "$RUNNER_TEMP/foreign"
          composer require stripe/stripe-php:^17.0 --working-dir="$RUNNER_TEMP/foreign" --no-interaction
          php "$RUNNER_TEMP/release/php-scoper/smoke-test.php" "$RUNNER_TEMP/release" --foreign="$RUNNER_TEMP/foreign/vendor/autoload.php"

      - name: Set up PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: json, mbstring

      - name: Prove the shipped code on the PHP 7.4 floor
        run: |
          php "$RUNNER_TEMP/release/php-scoper/smoke-test.php" "$RUNNER_TEMP/release"
          find "$RUNNER_TEMP/release/vendor_prefixed" -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          php -l "$RUNNER_TEMP/release/php-scoper/vendor-prefixed-autoload.php"

  php-tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: php-lint
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit tests
        run: composer test

      - name: Generate coverage report
        if: matrix.php == '8.2'
        run: composer test:coverage

      - name: Upload coverage to Codecov
        if: matrix.php == '8.2'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  conformance:
    name: Conformance PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    needs: php-lint
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    defaults:
      run:
        working-directory: stripe-terminal-for-woocommerce

    steps:
      - name: Checkout extension
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: stripe-terminal-for-woocommerce
          persist-credentials: false

      # Pro's provider conformance suite runs the real adapter under wp-env with Pro (which vendors
      # Free) as a sibling plugin; see tests/conformance/. The org-level wcpos-bot App mints a token
      # scoped to contents:read on the private Pro repo. Fork PRs get no secrets and stop here by design.
      - name: Read-only Pro token
        id: pro-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WCPOS_BOT_APP_ID }}
          private-key: ${{ secrets.WCPOS_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: woocommerce-pos-pro
          permission-contents: read

      - name: Checkout Pro next as sibling
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: wcpos/woocommerce-pos-pro
          ref: next
          path: woocommerce-pos-pro
          token: ${{ steps.pro-token.outputs.token }}
          persist-credentials: false

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Install Composer dependencies
        run: |
          composer install --no-interaction --prefer-dist
          composer install --working-dir=../woocommerce-pos-pro --no-interaction --prefer-dist

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Start WordPress test environment
        run: |
          npm i -g @wordpress/env
          printf '{"phpVersion":"%s"}\n' '${{ matrix.php }}' > .wp-env.override.json
          wp-env start

      # Transcripts are compared, never recorded, here: recording is an opt-in inside the PHPUnit
      # process (`wp-env run tests-cli -- env WCPOS_RECORD_TRANSCRIPTS=1 ...`) that CI does not set.
      - name: Provider conformance suite
        run: wp-env run --env-cwd='wp-content/plugins/stripe-terminal-for-woocommerce' tests-cli -- vendor/bin/phpunit -c phpunit.conformance.xml.dist

  stripe-live-tests:
    name: Stripe Test-Mode Smoke
    runs-on: ubuntu-latest
    needs: php-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run Stripe test-mode smoke tests
        run: |
          if [ -z "${STWC_STRIPE_TEST_SECRET_KEY}" ]; then
            echo "STWC_STRIPE_TEST_SECRET_KEY is not set; skipping Stripe smoke tests."
            exit 0
          fi
          composer test:stripe
        env:
          STWC_STRIPE_TEST_SECRET_KEY: ${{ secrets.STWC_STRIPE_TEST_SECRET_KEY }}

  e2e-tests:
    name: E2E Tests
    # Pinned: ubuntu-latest became 26.04 on 2026-10-29 and Playwright has no
    # chromium build for it ("does not support chromium on ubuntu26.04-x64").
    runs-on: ubuntu-24.04
    needs: php-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install Composer dependencies
        run: composer install --no-dev

      # The extension is Pro-only: the site needs WooCommerce POS Pro (which vendors the free
      # plugin) or the bootstrap registers nothing. The org-level wcpos-bot App mints a token
      # scoped to contents:read on the private Pro repo.
      - name: Read-only Pro token
        id: pro-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WCPOS_BOT_APP_ID }}
          private-key: ${{ secrets.WCPOS_BOT_PRIVATE_KEY }}
          owner: wcpos
          repositories: woocommerce-pos-pro
          permission-contents: read

      - name: Checkout Pro next into the E2E site
        uses: actions/checkout@v7
        with:
          repository: wcpos/woocommerce-pos-pro
          ref: next
          path: e2e/pro/woocommerce-pos-pro
          token: ${{ steps.pro-token.outputs.token }}
          persist-credentials: false

      - name: Install Pro's Composer dependencies
        working-directory: e2e/pro/woocommerce-pos-pro
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Build payment-frontend
        working-directory: packages/payment-frontend
        run: |
          npm install
          npm run build

      - name: Start Docker environment
        working-directory: e2e
        run: docker compose up -d --wait
        env:
          STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}

      - name: Wait for WordPress setup to complete
        working-directory: e2e
        run: |
          # The wp-cli container is a one-shot setup container that installs
          # WooCommerce, activates plugins, and creates test data. We need to
          # wait for it to finish before running tests.
          if ! timeout 10m docker compose logs -f wp-cli; then
            echo "::error::Timed out waiting for wp-cli setup to complete"
            exit 1
          fi
          WPCLI_CONTAINER_ID="$(docker compose ps -aq wp-cli)"
          if [ -z "$WPCLI_CONTAINER_ID" ]; then
            echo "::error::wp-cli container was not found"
            exit 1
          fi
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' "$WPCLI_CONTAINER_ID")
          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::WordPress setup failed with exit code $EXIT_CODE"
            exit 1
          fi

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Stop Docker environment
        if: always()
        working-directory: e2e
        run: docker compose down -v
